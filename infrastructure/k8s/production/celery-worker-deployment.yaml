apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  labels:
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/part-of: autolytiq
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-worker
        app.kubernetes.io/part-of: autolytiq
    spec:
      imagePullSecrets:
        - name: do-regcred
      containers:
        - name: celery-worker
          image: registry.digitalocean.com/autolytiq/ml-service:__TAG__
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - workers.celery_app
            - worker
            - --queues=high_priority,default
            - --loglevel=info
            - --concurrency=4
          envFrom:
            - secretRef:
                name: app-env
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  labels:
    app.kubernetes.io/name: celery-beat
    app.kubernetes.io/part-of: autolytiq
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-beat
        app.kubernetes.io/part-of: autolytiq
    spec:
      imagePullSecrets:
        - name: do-regcred
      containers:
        - name: celery-beat
          image: registry.digitalocean.com/autolytiq/ml-service:__TAG__
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - workers.celery_app
            - beat
            - --loglevel=info
          envFrom:
            - secretRef:
                name: app-env
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
