apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-pricing
  labels:
    app.kubernetes.io/name: rust-pricing
    app.kubernetes.io/part-of: autolytiq
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-pricing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-pricing
        app.kubernetes.io/part-of: autolytiq
    spec:
      imagePullSecrets:
        - name: do-regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: rust-pricing
          image: registry.digitalocean.com/autolytiq/rust-pricing:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: RUST_LOG
              value: info
            - name: PRICE_ENGINE__SERVICE__PORT
              value: "50051"
            - name: PRICE_ENGINE__SERVICE__HOST
              value: "0.0.0.0"
            - name: PRICE_ENGINE__DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: DATABASE_URL
            - name: PRICE_ENGINE__REDIS__URL
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: REDIS_URL
            - name: PRICE_ENGINE__LOGGING__LEVEL
              value: info
            - name: PRICE_ENGINE__LOGGING__FORMAT
              value: json
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"
          startupProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rust-pricing
  labels:
    app.kubernetes.io/name: rust-pricing
    app.kubernetes.io/part-of: autolytiq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rust-pricing
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
