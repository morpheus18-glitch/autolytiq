name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - 'packages/tokens/**'
      - 'apps/frontend/Dockerfile'
      - 'apps/frontend/nginx.conf'
      - 'infrastructure/k8s/production/frontend-deployment.yaml'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/autolytiq
  IMAGE_NAME: frontend
  DEPLOYMENT_NAME: frontend
  CONTAINER_NAME: frontend
  CLUSTER: autolytiq-cluster
  NAMESPACE: autolytiq-prod

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Authenticate to DOCR
        run: doctl registry login --expiry-seconds 3600

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          push: true
          provenance: false
          sbom: false
          build-args: |
            VITE_API_URL=https://api.autolytiq.com
            VITE_ML_SERVICE_URL=https://ml.autolytiq.com
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save "$CLUSTER"

      - name: Ensure namespace exists
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh DOCR secret
        run: |
          doctl registry docker-config --expiry-seconds 3600 \
            | kubectl -n "$NAMESPACE" create secret generic do-regcred \
              --from-file=.dockerconfigjson=/dev/stdin \
              --type=kubernetes.io/dockerconfigjson \
              --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy frontend
        run: |
          sed "s|image:.*frontend:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" \
            infrastructure/k8s/production/frontend-deployment.yaml | \
            kubectl apply -n "$NAMESPACE" -f -
      - name: Wait for rollout
        run: kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n "$NAMESPACE" --timeout=180s
