apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: autolytiq-prod
  name: ml-service
  namespace: autolytiq-prod
  namespace: autolytiq-prod
  labels:
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: autolytiq
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-service
        app.kubernetes.io/part-of: autolytiq
    spec:
      imagePullSecrets:
        - name: do-regcred
      containers:
        - name: ml-service
          image: registry.digitalocean.com/autolytiq/ml-service:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: UVICORN_PORT
              value: "8000"
            - name: UVICORN_HOST
              value: 0.0.0.0
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1.5"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 40
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      nodeSelector:
        workload-type: ml-heavy
      tolerations:
      - key: "workload-type"
        operator: "Equal"
        value: "ml-heavy"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  namespace: autolytiq-prod
  name: ml-service
  namespace: autolytiq-prod
  namespace: autolytiq-prod
  labels:
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: autolytiq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ml-service
  ports:
    - name: http
      port: 80
      targetPort: http
