apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: dms-production
  labels:
    app: ml-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: registry.digitalocean.com/autolytiq/ml-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: REDIS_URL
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
      imagePullSecrets:
        - name: registry-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: dms-production
spec:
  selector:
    app: ml-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
