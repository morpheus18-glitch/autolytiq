name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-22.04
    env:
      # TEMPORARY: Dev defaults for quick deployment (configure GitHub Secrets later)
      REGISTRY: ${{ secrets.REGISTRY || 'registry.digitalocean.com/autolytiq' }}
    strategy:
      matrix:
        include:
          - name: backend
            file: apps/backend/Dockerfile
            context: .
            build-args: |
              DATABASE_URL=postgresql://autolytiq:autolytiq@localhost:5432/autolytiq
          - name: frontend
            file: apps/frontend/Dockerfile
            context: .
          - name: ml-service
            file: ml_service/Dockerfile
            context: .
          - name: rust-pricing
            file: services/rust-pricing/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Authenticate to DOCR
        run: doctl registry login --expiry-seconds 3600

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.name }}:buildcache
          build-args: ${{ matrix.build-args || '' }}

  deploy:
    name: Apply Manifests and Roll Out
    runs-on: ubuntu-22.04
    needs: build
    env:
      # TEMPORARY: Dev defaults for quick deployment (configure GitHub Secrets later)
      REGISTRY: ${{ secrets.REGISTRY || 'registry.digitalocean.com/autolytiq' }}
      DO_CLUSTER: ${{ secrets.CLUSTER || 'autolytiq-cluster' }}
      NS: ${{ secrets.NS || 'autolytiq-prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save "$DO_CLUSTER"

      - name: Ensure namespace exists
        run: |
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh DO registry pull secret
        run: |
          doctl registry docker-config --expiry-seconds 3600 \
            | kubectl -n "$NS" create secret generic do-regcred \
                --from-file=.dockerconfigjson=/dev/stdin \
                --type=kubernetes.io/dockerconfigjson \
                --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync application secret
        env:
          # TEMPORARY: Dev defaults - configure GitHub Secrets for production
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://autolytiq:autolytiq@postgres:5432/autolytiq?schema=public' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL || 'postgresql://autolytiq:autolytiq@postgres:5432/autolytiq?schema=public' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'dev-jwt-secret-change-in-production' }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY || '' }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER || 'autolytiq-dev' }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE || 'autolytiq-dev' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY || '' }}
          SENDGRID_FROM: ${{ secrets.SENDGRID_FROM || '' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID || '' }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN || '' }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID || '' }}
          TWILIO_CALLER_ID: ${{ secrets.TWILIO_CALLER_ID || '' }}
          SOCKET_IO_CORS_ORIGIN: ${{ secrets.SOCKET_IO_CORS_ORIGIN || '*' }}
          APP_URL: ${{ secrets.APP_URL || 'http://localhost:3000' }}
          API_URL: ${{ secrets.API_URL || 'http://localhost:5000' }}
          ML_SERVICE_URL: ${{ secrets.ML_SERVICE_URL || 'http://ml-service:8000' }}
          ML_SERVICE_TOKEN: ${{ secrets.ML_SERVICE_TOKEN || 'dev-ml-token' }}
          REDIS_URL: ${{ secrets.REDIS_URL || '' }}
        run: |
          # Create secret with environment variables (using dev defaults if secrets not configured)
          kubectl -n "$NS" create secret generic app-env \
            --from-literal=NODE_ENV='production' \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=DIRECT_URL="$DIRECT_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY" \
            --from-literal=JWT_ISSUER="$JWT_ISSUER" \
            --from-literal=JWT_AUDIENCE="$JWT_AUDIENCE" \
            --from-literal=SENDGRID_API_KEY="$SENDGRID_API_KEY" \
            --from-literal=SENDGRID_FROM="$SENDGRID_FROM" \
            --from-literal=TWILIO_ACCOUNT_SID="$TWILIO_ACCOUNT_SID" \
            --from-literal=TWILIO_AUTH_TOKEN="$TWILIO_AUTH_TOKEN" \
            --from-literal=TWILIO_MESSAGING_SERVICE_SID="$TWILIO_MESSAGING_SERVICE_SID" \
            --from-literal=TWILIO_CALLER_ID="$TWILIO_CALLER_ID" \
            --from-literal=SOCKET_IO_CORS_ORIGIN="$SOCKET_IO_CORS_ORIGIN" \
            --from-literal=APP_URL="$APP_URL" \
            --from-literal=API_URL="$API_URL" \
            --from-literal=ML_SERVICE_URL="$ML_SERVICE_URL" \
            --from-literal=ML_SERVICE_TOKEN="$ML_SERVICE_TOKEN" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply production manifests with image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Replace __TAG__ placeholder with actual git SHA before applying
          mkdir -p /tmp/k8s-manifests
          for file in infrastructure/k8s/production/*.yaml; do
            if [ -f "$file" ]; then
              sed "s|__TAG__|${IMAGE_TAG}|g" "$file" > "/tmp/k8s-manifests/$(basename $file)"
            fi
          done
          kubectl -n "$NS" apply -f /tmp/k8s-manifests/

      - name: Run Prisma migrations
        env:
          IMAGE: ${{ secrets.REGISTRY }}/backend:${{ github.sha }}
        run: |
          kubectl -n "$NS" run migrate \
            --image="$IMAGE" \
            --restart=Never \
            --overrides='{"spec":{"imagePullSecrets":[{"name":"do-regcred"}]}}' \
            --env-from=secret/app-env \
            --command -- npx prisma migrate deploy
          kubectl -n "$NS" wait --for=condition=complete --timeout=120s pod/migrate
          kubectl -n "$NS" delete pod migrate --ignore-not-found=true

      - name: Wait for rollout to complete
        run: |
          for svc in backend frontend ml-service rust-pricing; do
            kubectl -n "$NS" rollout status deploy/$svc --timeout=180s || kubectl -n "$NS" get pods
          done

      - name: Smoke test ingress endpoints
        run: |
          LB=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          for host in api ml app; do
            echo "--- $host.autolytiq.com"
            curl -sSI "http://$LB" -H "Host: $host.autolytiq.com" | head -n 1
          done
