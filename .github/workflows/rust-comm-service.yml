name: Rust Comm Service Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'services/rust/comm-service/**'
      - 'services/rust/shared/**'
      - 'services/rust/proto/**'
      - 'services/rust/Cargo.toml'
      - '.github/workflows/rust-comm-service.yml'
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/autolytiq
  IMAGE_NAME: rust-comm-service
  DEPLOYMENT_NAME: rust-comm-service
  CONTAINER_NAME: rust-comm-service
  CLUSTER: autolytiq-cluster
  NAMESPACE: autolytiq-prod
  SERVICE_NAME: comm-service

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Debug - Show comm-service structure
        run: |
          echo "=== Building Rust Comm Service ==="
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Image: ${{ env.IMAGE_NAME }}"
          ls -la services/rust/comm-service/

      - uses: docker/setup-buildx-action@v3
      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
      - name: Authenticate to DOCR
        run: doctl registry login --expiry-seconds 3600
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/rust/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            SERVICE_NAME=${{ env.SERVICE_NAME }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save "$CLUSTER"
      - name: Ensure namespace exists
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      - name: Refresh DOCR secret
        run: |
          doctl registry docker-config --expiry-seconds 3600 \
            | kubectl -n "$NAMESPACE" create secret generic do-regcred \
              --from-file=.dockerconfigjson=/dev/stdin \
              --type=kubernetes.io/dockerconfigjson \
              --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy Rust comm service
        run: |
          sed "s|image:.*rust-comm-service:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" \
            infrastructure/k8s/production/rust-comm-service-deployment.yaml | \
            kubectl apply -n "$NAMESPACE" -f -
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n "$NAMESPACE" --timeout=180s
