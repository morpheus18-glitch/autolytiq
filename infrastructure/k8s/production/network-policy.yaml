apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autolytiq-network-policy
  namespace: autolytiq-prod
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from nginx ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - port: 80
      protocol: TCP
    - port: 3000
      protocol: TCP
    - port: 3001
      protocol: TCP
    - port: 5000
      protocol: TCP
    - port: 8000
      protocol: TCP
    - port: 8080
      protocol: TCP
  # Allow pod-to-pod communication within namespace
  - from:
    - podSelector: {}
    ports:
    - port: 80
      protocol: TCP
    - port: 3000
      protocol: TCP
    - port: 3001
      protocol: TCP
    - port: 5000
      protocol: TCP
    - port: 8000
      protocol: TCP
    - port: 8080
      protocol: TCP
    - port: 50051
      protocol: TCP
    - port: 50052
      protocol: TCP
    - port: 6379
      protocol: TCP
  egress:
  # Allow egress to pods within namespace
  - to:
    - podSelector: {}
  # Allow egress to all namespaces
  - to:
    - namespaceSelector: {}
  # Allow DNS and external traffic
  - ports:
    - protocol: TCP
    - protocol: UDP
