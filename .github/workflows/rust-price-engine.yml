name: Rust Price Engine Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'services/rust/price-engine/**'
      - 'services/rust/shared/**'
      - 'services/rust/proto/**'
      - 'services/rust/Cargo.toml'
      - '.github/workflows/rust-price-engine.yml'
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/autolytiq
  IMAGE_NAME: rust-price-engine
  DEPLOYMENT_NAME: rust-pricing
  NAMESPACE: autolytiq-prod
  CLUSTER: autolytiq-cluster
  SERVICE_NAME: price-engine

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Authenticate to DOCR
        run: doctl registry login --expiry-seconds 3600

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/rust/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            SERVICE_NAME=${{ env.SERVICE_NAME }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER }}

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh secrets
        run: |
          kubectl create secret generic rust-price-engine-env -n ${{ env.NAMESPACE }} \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=REDIS_URL="${{ secrets.REDIS_URL }}" \
            --from-literal=RUST_LOG=info \
            --dry-run=client -o yaml | kubectl apply -f -

          doctl registry docker-config --expiry-seconds 3600 | \
            kubectl -n ${{ env.NAMESPACE }} create secret generic do-regcred \
            --from-file=.dockerconfigjson=/dev/stdin \
            --type=kubernetes.io/dockerconfigjson \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy price engine
        run: |
          sed "s|image:.*rust-price-engine:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" \
            infrastructure/k8s/production/rust-pricing-deployment.yaml | \
            kubectl apply -n ${{ env.NAMESPACE }} -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=300s
