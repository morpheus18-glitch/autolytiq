name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Dev environment placeholders - configure these in GitHub Secrets for production
  REGISTRY: ${{ secrets.REGISTRY || 'registry.digitalocean.com/autolytiq' }}
  DO_CLUSTER: ${{ secrets.CLUSTER || 'autolytiq-cluster' }}
  NS: ${{ secrets.NS || 'autolytiq-prod' }}
  DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://autolytiq:autolytiq@postgres:5432/autolytiq?schema=public' }}

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - name: backend
            file: apps/backend/Dockerfile
            context: .
            build-args: |
              DATABASE_URL=${{ env.DATABASE_URL }}
          - name: frontend
            file: apps/frontend/Dockerfile
            context: .
          - name: ml-service
            file: ml_service/Dockerfile
            context: .
          - name: rust-pricing
            file: services/rust-pricing/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Authenticate to DOCR
        run: doctl registry login --expiry-seconds 3600

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.name }}:buildcache,mode=max
          build-args: ${{ matrix.build-args || '' }}

  deploy:
    name: Apply Manifests and Roll Out
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save "${{ env.DO_CLUSTER }}"

      - name: Ensure namespace exists
        run: |
          kubectl create namespace "${{ env.NS }}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh DO registry pull secret
        run: |
          doctl registry docker-config --expiry-seconds 3600 \
            | kubectl -n "${{ env.NS }}" create secret generic do-regcred \
                --from-file=.dockerconfigjson=/dev/stdin \
                --type=kubernetes.io/dockerconfigjson \
                --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync application secret
        run: |
          # Create secret with dev/placeholder values for quick deployment
          # Configure GitHub Secrets for production deployment
          kubectl -n "${{ env.NS }}" create secret generic app-env \
            --from-literal=NODE_ENV='production' \
            --from-literal=DATABASE_URL='${{ env.DATABASE_URL }}' \
            --from-literal=JWT_PUBLIC_KEY='-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEApGfG60JgB+vHNiTNGOBy
          g4S1hoPazTA/gkGEXUXMaLLq5yRvCNrI6VOGGAaHo9dZYkTfGZNVVRFl1kYyqS/f
          wLw1sYUNsGrD+VUKPTySGTsNMndvrYVF/1DdbC+aD7agEXkNKOxPQ0PqSxkbZVqM
          l8I4JVXu2fLG3gNsYch0JJYRqpMfrQa6RlmKCNt2uQ6Xo8XzYx+lNEzbG8VS9/6g
          xF2Y2v3hF8oD7YVOlJawVSjGInxjeRGna43EIBgzHuLlHotE5T7V6czS4QhIwTZY
          h9+VFeReyqYhB1tZEDQhTWZ+9VtxxvpG6vE11wV8L19/9ey7NwxKXlzVEk+iXdc5
          FQIDAQAB
          -----END PUBLIC KEY-----' \
            --from-literal=JWT_ISSUER='autolytiq-dev' \
            --from-literal=JWT_AUDIENCE='autolytiq-dev' \
            --from-literal=SENDGRID_API_KEY='' \
            --from-literal=SENDGRID_FROM='' \
            --from-literal=TWILIO_ACCOUNT_SID='' \
            --from-literal=TWILIO_AUTH_TOKEN='' \
            --from-literal=TWILIO_MESSAGING_SERVICE_SID='' \
            --from-literal=TWILIO_CALLER_ID='' \
            --from-literal=SOCKET_IO_CORS_ORIGIN='*' \
            --from-literal=APP_URL='http://app.autolytiq.com' \
            --from-literal=API_URL='http://api.autolytiq.com' \
            --from-literal=ML_SERVICE_URL='http://ml-service:8000' \
            --from-literal=ML_SERVICE_TOKEN='dev-ml-token' \
            --from-literal=REDIS_URL='' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply production manifests
        run: |
          kubectl -n "${{ env.NS }}" apply -f infrastructure/k8s/production/

      - name: Run Prisma migrations
        run: |
          kubectl -n "${{ env.NS }}" run migrate \
            --image="${{ env.REGISTRY }}/backend:${{ github.sha }}" \
            --restart=Never \
            --overrides='{"spec":{"imagePullSecrets":[{"name":"do-regcred"}]}}' \
            --env-from=secret/app-env \
            --command -- npx prisma migrate deploy
          kubectl -n "${{ env.NS }}" wait --for=condition=complete --timeout=120s pod/migrate
          kubectl -n "${{ env.NS }}" delete pod migrate --ignore-not-found=true

      - name: Update deployments
        run: |
          for svc in backend frontend ml-service rust-pricing; do
            kubectl -n "${{ env.NS }}" set image deploy/$svc $svc=${{ env.REGISTRY }}/$svc:${{ github.sha }} --record || true
            kubectl -n "${{ env.NS }}" rollout status deploy/$svc --timeout=180s || kubectl -n "${{ env.NS }}" get pods
          done

      - name: Smoke test ingress endpoints
        run: |
          LB=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "localhost")
          for host in api ml app; do
            echo "--- $host.autolytiq.com"
            curl -sSI "http://$LB" -H "Host: $host.autolytiq.com" | head -n 1 || echo "Endpoint check failed (non-critical)"
          done
