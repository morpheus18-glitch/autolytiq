apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-pricing
  labels:
    app.kubernetes.io/name: rust-pricing
    app.kubernetes.io/part-of: autolytiq
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-pricing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-pricing
        app.kubernetes.io/part-of: autolytiq
    spec:
      imagePullSecrets:
        - name: do-regcred
      containers:
        - name: rust-pricing
          image: registry.digitalocean.com/autolytiq/rust-pricing:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["/usr/local/bin/grpc_health_probe", "-addr=:50051"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/usr/local/bin/grpc_health_probe", "-addr=:50051"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rust-pricing
  labels:
    app.kubernetes.io/name: rust-pricing
    app.kubernetes.io/part-of: autolytiq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rust-pricing
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
