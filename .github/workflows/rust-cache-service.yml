name: Rust Cache Service Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'services/rust/cache-service/**'
      - 'services/rust/shared/**'
      - 'services/rust/proto/**'
      - 'services/rust/Cargo.toml'
      - '.github/workflows/rust-cache-service.yml'
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/autolytiq
  IMAGE_NAME: rust-cache-service
  DEPLOYMENT_NAME: rust-cache-service
  NAMESPACE: autolytiq-prod
  CLUSTER: autolytiq-cluster
  SERVICE_NAME: cache-service

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Debug - Show cache-service structure
        run: |
          echo "=== Building Rust Cache Service ==="
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Image: ${{ env.IMAGE_NAME }}"
          ls -la services/rust/cache-service/

      - uses: docker/setup-buildx-action@v3

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Authenticate to DOCR
        run: doctl registry login --expiry-seconds 3600

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/rust/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            SERVICE_NAME=${{ env.SERVICE_NAME }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER }}

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh secrets
        run: |
          kubectl create secret generic rust-cache-env -n ${{ env.NAMESPACE }} \
            --from-literal=REDIS_URL="${{ secrets.REDIS_URL }}" \
            --from-literal=RUST_LOG=info \
            --dry-run=client -o yaml | kubectl apply -f -

          doctl registry docker-config --expiry-seconds 3600 | \
            kubectl -n ${{ env.NAMESPACE }} create secret generic do-regcred \
            --from-file=.dockerconfigjson=/dev/stdin \
            --type=kubernetes.io/dockerconfigjson \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy cache service
        run: |
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ env.DEPLOYMENT_NAME }}
            namespace: ${{ env.NAMESPACE }}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: rust-cache-service
            template:
              metadata:
                labels:
                  app: rust-cache-service
              spec:
                imagePullSecrets:
                  - name: do-regcred
                containers:
                  - name: cache-service
                    image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                    ports:
                      - containerPort: 50053
                        name: grpc
                    envFrom:
                      - secretRef:
                          name: rust-cache-env
                    resources:
                      requests:
                        memory: "128Mi"
                        cpu: "100m"
                      limits:
                        memory: "256Mi"
                        cpu: "500m"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: rust-cache-service
            namespace: ${{ env.NAMESPACE }}
          spec:
            selector:
              app: rust-cache-service
            ports:
              - port: 50053
                targetPort: 50053
                name: grpc
          EOF

      - name: Wait for rollout
        run: kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=300s
