[workspace]
members = [
    "price-engine",
    "comm-service",
    "shared",
    "cache-service",
    "rate-limiter",
    "tax-svc",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
authors = ["AutolytiQ Team"]
license = "MIT"

[workspace.dependencies]
# gRPC and protobuf
tonic = "0.11"
tonic-build = "0.11"
prost = "0.12"
prost-types = "0.12"

# Async runtime
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"

# Database
diesel = { version = "2.1", features = ["postgres", "r2d2", "chrono", "numeric"] }
diesel-async = { version = "0.4", features = ["postgres", "deadpool"] }
deadpool = "0.10"

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "streams"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.23"
opentelemetry = { version = "0.22", features = ["trace"] }
opentelemetry-otlp = { version = "0.15", features = ["trace"] }
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
rust_decimal = { version = "1.34", features = ["serde-float"] }
rust_decimal_macros = "1.34"
futures = "0.3"
async-trait = "0.1"
tower = "0.4"
http = "1.0"

# Rate limiting and circuit breaker
governor = "0.6"
failsafe = "1.2"

# Metrics
prometheus = "0.13"

# Connection pooling
r2d2 = "0.8"

# Utilities
rand = "0.8"

# Testing
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
