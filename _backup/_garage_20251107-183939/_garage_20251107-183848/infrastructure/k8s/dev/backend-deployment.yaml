apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: autolytiq-dev
  labels:
    app.kubernetes.io/name: autolytiq-backend
    app.kubernetes.io/part-of: autolytiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autolytiq-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autolytiq-backend
        app.kubernetes.io/part-of: autolytiq
    spec:
      containers:
        - name: backend
          image: autolytiq/backend-dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
