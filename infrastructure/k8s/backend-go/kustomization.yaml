apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: autolytiq-prod

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: backend-go
  app.kubernetes.io/component: backend
  app.kubernetes.io/part-of: autolytiq

images:
  - name: registry.digitalocean.com/autolytiq/backend-go
    newTag: latest

# Node affinity for autolytiq-pool
patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          doks.digitalocean.com/node-pool: autolytiq-pool
    target:
      kind: Deployment
      name: backend-go
