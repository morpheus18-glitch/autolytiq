services:
  backend:
    environment:
      DATABASE_URL: postgres://autolytiq:autolytiq@db:5432/autolytiq?schema=public
      DIRECT_URL: postgres://autolytiq:autolytiq@db:5432/autolytiq?schema=public
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-dev-ml-token}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: http://s3:9000
      S3_CLOUDFRONT_URL: ${S3_CLOUDFRONT_URL}
      PRINT_BASE_URL: http://backend:5000
      CLAMAV_HOST: ${CLAMAV_HOST}
      CLAMAV_PORT: ${CLAMAV_PORT}
    volumes:
      - ./prisma:/app/prisma:ro
  frontend:
    environment:
      VITE_API_URL: http://backend:5000
  ml:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autolytiq
      POSTGRES_PASSWORD: autolytiq
      POSTGRES_DB: autolytiq
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  pg-router:
    image: nginx:1.27-alpine
    depends_on:
      - db
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/docker/nginx/postgres-stream.conf:/etc/nginx/nginx.conf:ro
  s3:
    image: minio/minio:RELEASE.2024-10-13T03-09-05Z
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data
volumes:
  db-data:
  s3-data:
