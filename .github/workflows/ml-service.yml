name: ML Service CI/CD

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'ml_service/**'
      - 'infrastructure/docker/Dockerfile.ml'
      - '.github/workflows/ml-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ml_service/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ml-service

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./ml_service
        run: |
          pip install -r requirements.txt
          pip install -r requirements-worker.txt
          pip install pytest pytest-cov flake8

      - name: Run tests
        working-directory: ./ml_service
        run: pytest --cov=. --cov-report=xml

      - name: Lint
        working-directory: ./ml_service
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ml_service
          file: ../infrastructure/docker/Dockerfile.ml
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy ML service
        run: |
          kubectl set image deployment/ml-service ml-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main -n dms-production
          kubectl rollout status deployment/ml-service -n dms-production

      - name: Deploy Celery workers
        run: |
          kubectl set image deployment/celery-worker celery-worker=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main -n dms-production
          kubectl rollout status deployment/celery-worker -n dms-production
