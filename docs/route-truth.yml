api_endpoints:
  # Authentication
  - path: /api/auth/user
    methods: [GET]
    description: Get current user
  
  - path: /api/auth/login
    methods: [POST]
    description: User login
  
  - path: /api/auth/logout
    methods: [POST]
    description: User logout
  
  - path: /api/auth/session
    methods: [GET]
    description: Get session info
  
  # Vehicles & Inventory
  - path: /api/vehicles
    methods: [GET, POST]
    description: Vehicle CRUD operations
  
  - path: /api/vehicles/:id
    methods: [GET, PUT, DELETE]
    description: Single vehicle operations
  
  - path: /api/vehicles/:id/photos
    methods: [POST]
    description: Upload vehicle photos
  
  - path: /api/vehicles/:id/pricing
    methods: [PUT]
    description: Update vehicle pricing
  
  - path: /api/pricing-insights/:id
    methods: [POST, PUT, DELETE]
    description: Pricing insights CRUD
  
  # VIN Decoding
  - path: /api/decode-vin
    methods: [POST]
    description: Decode VIN
  
  - path: /api/decode-vin/:vin
    methods: [GET]
    description: Decode VIN by param
  
  - path: /api/legacy-decode-vin/:vin
    methods: [GET]
    description: Legacy VIN decoder
  
  # Valuations
  - path: /api/valuations/:id
    methods: [GET]
    description: Get valuation
  
  - path: /api/valuations/batch
    methods: [POST]
    description: Batch valuations
  
  - path: /api/valuations/quick
    methods: [POST]
    description: Quick valuation
  
  - path: /api/valuations/refresh/:id
    methods: [POST]
    description: Refresh valuation
  
  # Customers
  - path: /api/customers
    methods: [GET, POST]
    description: Customer CRUD operations
  
  - path: /api/customers/:id
    methods: [GET, PUT, DELETE]
    description: Single customer operations
  
  - path: /api/customers/:id/notes
    methods: [GET, POST]
    description: Customer notes
  
  - path: /api/customers/:id/calls
    methods: [GET, POST]
    description: Customer calls
  
  - path: /api/customers/:id/documents
    methods: [GET, POST]
    description: Customer documents
  
  - path: /api/customers/:id/vehicles-of-interest
    methods: [GET, POST]
    description: Vehicles of interest
  
  # Leads & Sales
  - path: /api/leads
    methods: [GET, POST]
    description: Lead CRUD operations
  
  - path: /api/leads/:id
    methods: [PUT, DELETE]
    description: Single lead operations
  
  - path: /api/sales
    methods: [GET, POST]
    description: Sales operations
  
  # Deals
  - path: /api/deals
    methods: [GET, POST]
    description: Deal CRUD operations
  
  - path: /api/deals/:id
    methods: [GET, PUT]
    description: Single deal operations
  
  - path: /api/deals/:id/status
    methods: [PATCH]
    description: Update deal status
  
  - path: /api/deals/:id/products
    methods: [GET, POST]
    description: Deal products (F&I)
  
  - path: /api/deals/:id/gross
    methods: [GET]
    description: Deal gross profit
  
  - path: /api/deals/:id/accounting
    methods: [GET]
    description: Deal accounting data
  
  - path: /api/deals/:id/finalize
    methods: [POST, PUT]
    description: Finalize deal
  
  # Deal Jackets
  - path: /api/deal-jackets
    methods: [GET]
    description: List deal jackets
  
  - path: /api/deal-jackets/:id
    methods: [GET, PATCH]
    description: Deal jacket operations
  
  # Machine Learning
  - path: /api/ml/pricing-analysis
    methods: [POST]
    description: ML pricing analysis
  
  - path: /api/ml/competitive-intel
    methods: [POST]
    description: ML competitive intelligence
  
  - path: /api/ml/market-trends
    methods: [GET, POST]
    description: ML market trends
  
  # Dashboard & Metrics
  - path: /api/dashboard/metrics
    methods: [GET]
    description: Dashboard metrics
  
  - path: /api/activities
    methods: [GET]
    description: Activity feed
  
  # System
  - path: /api/system/health
    methods: [GET]
    description: System health check
  
  - path: /api/stores
    methods: [GET]
    description: Multi-store data

