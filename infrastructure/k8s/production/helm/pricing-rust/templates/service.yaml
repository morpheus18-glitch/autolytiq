apiVersion: v1
kind: Service
metadata:
  name: {{ include "autolytiq-pricing-rust.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autolytiq-pricing-rust.labels" . | nindent 4 }}
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-protocol: "tcp"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: {{ .Values.service.protocol }}
      name: grpc
  selector:
    {{- include "autolytiq-pricing-rust.selectorLabels" . | nindent 4 }}
