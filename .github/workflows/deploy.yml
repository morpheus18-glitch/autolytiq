name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: registry.digitalocean.com/autolytiq
  CLUSTER_NAME: autolytiq-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push backend image
        run: |
          docker build -f apps/backend/Dockerfile \
            -t ${{ env.REGISTRY }}/autolytiq-backend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/autolytiq-backend:latest \
            .
          docker push ${{ env.REGISTRY }}/autolytiq-backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/autolytiq-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -f apps/frontend/Dockerfile \
            -t ${{ env.REGISTRY }}/autolytiq-frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/autolytiq-frontend:latest \
            .
          docker push ${{ env.REGISTRY }}/autolytiq-frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/autolytiq-frontend:latest

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Create/Update Kubernetes secrets
        run: |
          # Create app secrets
          kubectl create secret generic autolytiq-secrets \
            --from-literal=jwt-secret='${{ secrets.JWT_SECRET }}' \
            --from-literal=database-url='${{ secrets.DATABASE_URL }}' \
            -n autolytiq-prod \
            --dry-run=client -o yaml | kubectl apply -f -

          # Create registry credentials for pulling images
          # Note: doctl outputs namespace kube-system, so we patch it to autolytiq-prod
          doctl registry kubernetes-manifest | \
            sed 's/namespace: kube-system/namespace: autolytiq-prod/' | \
            kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          # Apply manifests (creates or updates)
          kubectl apply -f k8s/backend-deployment.yaml -n autolytiq-prod
          kubectl apply -f k8s/frontend-deployment.yaml -n autolytiq-prod
          kubectl apply -f k8s/ingress.yaml -n autolytiq-prod

          # Update image tags to use commit SHA
          kubectl set image deployment/autolytiq-backend \
            backend=${{ env.REGISTRY }}/autolytiq-backend:${{ github.sha }} \
            -n autolytiq-prod || true

          kubectl set image deployment/autolytiq-frontend \
            frontend=${{ env.REGISTRY }}/autolytiq-frontend:${{ github.sha }} \
            -n autolytiq-prod || true

          # Wait for rollout to complete
          echo "Waiting for backend deployment..."
          kubectl rollout status deployment/autolytiq-backend -n autolytiq-prod --timeout=5m || {
            echo "Backend rollout failed, checking pods..."
            kubectl get pods -l app=autolytiq,component=backend -n autolytiq-prod
            kubectl describe pods -l app=autolytiq,component=backend -n autolytiq-prod
            exit 1
          }

          echo "Waiting for frontend deployment..."
          kubectl rollout status deployment/autolytiq-frontend -n autolytiq-prod --timeout=5m || {
            echo "Frontend rollout failed, checking pods..."
            kubectl get pods -l app=autolytiq,component=frontend -n autolytiq-prod
            kubectl describe pods -l app=autolytiq,component=frontend -n autolytiq-prod
            exit 1
          }

      - name: Verify deployment
        run: |
          kubectl get pods -n autolytiq-prod
          kubectl get services -n autolytiq-prod
          kubectl get ingress -n autolytiq-prod

          # Check backend health
          BACKEND_POD=$(kubectl get pod -l app=autolytiq,component=backend -n autolytiq-prod -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $BACKEND_POD -n autolytiq-prod -- wget -qO- http://localhost:3000/health || echo "Backend health check pending..."

      - name: Run database migrations
        run: |
          BACKEND_POD=$(kubectl get pod -l app=autolytiq,component=backend -n autolytiq-prod -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $BACKEND_POD -n autolytiq-prod -- npx prisma migrate deploy || echo "Migrations skipped or failed"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
