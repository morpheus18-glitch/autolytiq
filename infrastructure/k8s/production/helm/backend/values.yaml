replicaCount: 3

image:
  repository: registry.digitalocean.com/autolytiq/backend
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 5000

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "5000"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: backend-secrets
        key: database-url
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: backend-secrets
        key: jwt-secret
  - name: PRICING_GRPC_ADDR
    value: "pricing-rust:50051"

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/ready
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 5
