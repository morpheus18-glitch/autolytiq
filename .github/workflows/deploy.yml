name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Quality Gates
    runs-on: ubuntu-22.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autolytiq
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: autolytiq
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -d autolytiq -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run type checks
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_service/requirements.txt -r ml_service/requirements-worker.txt

      - name: Run Python tests
        working-directory: ml_service
        env:
          PYTHONPATH: ${{ github.workspace }}/ml_service
        run: pytest


  build:
    name: Build and Push Images
    runs-on: ubuntu-22.04
    needs: test
    strategy:
      matrix:
        include:
          - name: backend
            file: apps/backend/Dockerfile
            context: .
            build-args: |
              DATABASE_URL=${{ secrets.DATABASE_URL }}
          - name: frontend
            file: apps/frontend/Dockerfile
            context: .
          - name: ml-service
            file: ml_service/Dockerfile
            context: .
          - name: rust-pricing
            file: services/rust-pricing/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Authenticate to DOCR
        run: doctl registry login --expiry-seconds 3600

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: ${{ secrets.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY }}/${{ matrix.name }}:buildcache,mode=max
          build-args: ${{ matrix.build-args || '' }}

  deploy:
    name: Apply Manifests and Roll Out
    runs-on: ubuntu-22.04
    needs: build
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      DO_CLUSTER: ${{ secrets.CLUSTER }}
      NS: ${{ secrets.NS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save "$DO_CLUSTER"

      - name: Ensure namespace exists
        run: |
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh DO registry pull secret
        run: |
          doctl registry docker-config --expiry-seconds 3600 \
            | kubectl -n "$NS" create secret generic do-regcred \
                --from-file=.dockerconfigjson=/dev/stdin \
                --type=kubernetes.io/dockerconfigjson \
                --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync application secret
        run: |
          kubectl -n "$NS" create secret generic app-env \
            --from-literal=DATABASE_URL='${{ secrets.DATABASE_URL }}' \
            --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          # TODO: Extend with Twilio and SendGrid credentials when available.

      - name: Apply production manifests
        run: |
          kubectl -n "$NS" apply -f infrastructure/k8s/production/

      - name: Run Prisma migrations
        env:
          IMAGE: ${{ secrets.REGISTRY }}/backend:${{ github.sha }}
        run: |
          kubectl -n "$NS" delete job migrate --ignore-not-found=true
          cat <<'EOF' | kubectl -n "$NS" apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: migrate
            labels:
              app.kubernetes.io/name: migrate
              app.kubernetes.io/part-of: autolytiq
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                imagePullSecrets:
                  - name: do-regcred
                containers:
                  - name: migrate
                    image: "$IMAGE"
                    envFrom:
                      - secretRef:
                          name: app-env
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - npx prisma migrate deploy
          EOF
          kubectl -n "$NS" wait --for=condition=Complete --timeout=180s job/migrate
          POD=$(kubectl -n "$NS" get pods -l job-name=migrate -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NS" logs "$POD"
          kubectl -n "$NS" delete job migrate --ignore-not-found=true

      - name: Update deployments
        run: |
          for svc in backend frontend ml-service rust-pricing; do
            kubectl -n "$NS" set image deploy/$svc $svc=${{ secrets.REGISTRY }}/$svc:${{ github.sha }} --record || true
            kubectl -n "$NS" rollout status deploy/$svc --timeout=180s || kubectl -n "$NS" get pods
          done

      - name: Smoke test ingress endpoints
        run: |
          LB=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          for host in api ml app; do
            echo "--- $host.autolytiq.com"
            curl -sSI "http://$LB" -H "Host: $host.autolytiq.com" | head -n 1
          done
