name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DO_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Get commit SHA (short)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy Pricing Rust Service
        run: |
          helm upgrade --install pricing-rust \
            ./infrastructure/k8s/production/helm/pricing-rust \
            --namespace production \
            --create-namespace \
            --set image.tag=main-${{ steps.vars.outputs.sha_short }} \
            --wait

      - name: Deploy Backend
        run: |
          helm upgrade --install backend \
            ./infrastructure/k8s/production/helm/backend \
            --namespace production \
            --set image.tag=main-${{ steps.vars.outputs.sha_short }} \
            --wait

      - name: Deploy Worker
        run: |
          helm upgrade --install worker \
            ./infrastructure/k8s/production/helm/worker \
            --namespace production \
            --set image.tag=main-${{ steps.vars.outputs.sha_short }} \
            --wait

      - name: Deploy Frontend
        run: |
          helm upgrade --install frontend \
            ./infrastructure/k8s/production/helm/frontend \
            --namespace production \
            --set image.tag=main-${{ steps.vars.outputs.sha_short }} \
            --wait

      - name: Run smoke tests
        run: |
          chmod +x ./scripts/smoke.sh
          ./scripts/smoke.sh
