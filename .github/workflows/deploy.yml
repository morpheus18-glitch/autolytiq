name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - name: backend
            file: apps/backend/Dockerfile
            context: .
            build-args: |
              DATABASE_URL=${{ secrets.DATABASE_URL }}
          - name: frontend
            file: apps/frontend/Dockerfile
            context: .
          - name: ml-service
            file: ml_service/Dockerfile
            context: .
          - name: rust-pricing
            file: services/rust-pricing/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Authenticate to DOCR
        run: doctl registry login --expiry-seconds 3600

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: ${{ secrets.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY }}/${{ matrix.name }}:buildcache,mode=max
          build-args: ${{ matrix.build-args || '' }}

  deploy:
    name: Apply Manifests and Roll Out
    runs-on: ubuntu-22.04
    needs: build
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      DO_CLUSTER: ${{ secrets.CLUSTER }}
      NS: ${{ secrets.NS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save "$DO_CLUSTER"

      - name: Ensure namespace exists
        run: |
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh DO registry pull secret
        run: |
          doctl registry docker-config --expiry-seconds 3600 \
            | kubectl -n "$NS" create secret generic do-regcred \
                --from-file=.dockerconfigjson=/dev/stdin \
                --type=kubernetes.io/dockerconfigjson \
                --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync application secret
        run: |
          # Create secret with all required environment variables from backend/src/config/env.ts
          # This replaces the entire secret to ensure consistency across deployments
          #
          # IMPORTANT: If using managed Postgres with connection pooling (pgBouncer):
          # - DATABASE_URL should be the pooled connection (for app queries)
          # - DIRECT_URL should be the direct connection (for migrations)
          # If not using pooling, both can be the same value
          kubectl -n "$NS" create secret generic app-env \
            --from-literal=NODE_ENV='production' \
            --from-literal=DATABASE_URL='${{ secrets.DATABASE_URL }}' \
            --from-literal=DIRECT_URL='${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}' \
            --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            --from-literal=JWT_PUBLIC_KEY='${{ secrets.JWT_PUBLIC_KEY }}' \
            --from-literal=JWT_ISSUER='${{ secrets.JWT_ISSUER }}' \
            --from-literal=JWT_AUDIENCE='${{ secrets.JWT_AUDIENCE }}' \
            --from-literal=SENDGRID_API_KEY='${{ secrets.SENDGRID_API_KEY }}' \
            --from-literal=SENDGRID_FROM='${{ secrets.SENDGRID_FROM }}' \
            --from-literal=TWILIO_ACCOUNT_SID='${{ secrets.TWILIO_ACCOUNT_SID }}' \
            --from-literal=TWILIO_AUTH_TOKEN='${{ secrets.TWILIO_AUTH_TOKEN }}' \
            --from-literal=TWILIO_MESSAGING_SERVICE_SID='${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}' \
            --from-literal=TWILIO_CALLER_ID='${{ secrets.TWILIO_CALLER_ID }}' \
            --from-literal=SOCKET_IO_CORS_ORIGIN='${{ secrets.SOCKET_IO_CORS_ORIGIN }}' \
            --from-literal=APP_URL='${{ secrets.APP_URL }}' \
            --from-literal=API_URL='${{ secrets.API_URL }}' \
            --from-literal=ML_SERVICE_URL='${{ secrets.ML_SERVICE_URL }}' \
            --from-literal=ML_SERVICE_TOKEN='${{ secrets.ML_SERVICE_TOKEN }}' \
            --from-literal=REDIS_URL='${{ secrets.REDIS_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply production manifests with image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Replace __TAG__ placeholder with actual git SHA before applying
          mkdir -p /tmp/k8s-manifests
          for file in infrastructure/k8s/production/*.yaml; do
            if [ -f "$file" ]; then
              sed "s|__TAG__|${IMAGE_TAG}|g" "$file" > "/tmp/k8s-manifests/$(basename $file)"
            fi
          done
          kubectl -n "$NS" apply -f /tmp/k8s-manifests/

      - name: Run Prisma migrations
        env:
          IMAGE: ${{ secrets.REGISTRY }}/backend:${{ github.sha }}
        run: |
          kubectl -n "$NS" run migrate \
            --image="$IMAGE" \
            --restart=Never \
            --overrides='{"spec":{"imagePullSecrets":[{"name":"do-regcred"}]}}' \
            --env-from=secret/app-env \
            --command -- npx prisma migrate deploy
          kubectl -n "$NS" wait --for=condition=complete --timeout=120s pod/migrate
          kubectl -n "$NS" delete pod migrate --ignore-not-found=true

      - name: Wait for rollout to complete
        run: |
          for svc in backend frontend ml-service rust-pricing; do
            kubectl -n "$NS" rollout status deploy/$svc --timeout=180s || kubectl -n "$NS" get pods
          done

      - name: Smoke test ingress endpoints
        run: |
          LB=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          for host in api ml app; do
            echo "--- $host.autolytiq.com"
            curl -sSI "http://$LB" -H "Host: $host.autolytiq.com" | head -n 1
          done
