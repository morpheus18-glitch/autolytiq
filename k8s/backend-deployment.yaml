apiVersion: apps/v1
kind: Deployment
metadata:
  name: autolytiq-backend
  namespace: autolytiq-prod
  labels:
    app: autolytiq
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autolytiq
      component: backend
  template:
    metadata:
      labels:
        app: autolytiq
        component: backend
    spec:
      # Run on general pool, not ML pool
      nodeSelector:
        doks.digitalocean.com/node-pool: pool-autolytiq
      containers:
      - name: backend
        image: registry.digitalocean.com/autolytiq/autolytiq-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-env
              key: JWT_SECRET
        - name: FRONTEND_URL
          value: "https://autolytiq.com"
        resources:
          requests:
            memory: "96Mi"
            cpu: "75m"
          limits:
            memory: "192Mi"
            cpu: "150m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: autolytiq-backend
  namespace: autolytiq-prod
  labels:
    app: autolytiq
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: autolytiq
    component: backend
