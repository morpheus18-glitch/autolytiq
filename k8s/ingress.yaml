apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autolytiq-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - autolytiq.yourdomain.com
    secretName: autolytiq-tls
  rules:
  # Default rule (works with IP or any hostname)
  - http:
      paths:
      # Backend API
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: autolytiq-backend
            port:
              number: 3000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: autolytiq-backend
            port:
              number: 3000
      # Frontend (catch-all)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: autolytiq-frontend
            port:
              number: 80
