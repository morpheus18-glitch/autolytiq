[package]
name = "pricing-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# gRPC
tonic = "0.11"
prost = "0.12"
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"

# Web framework (for health check HTTP)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.21", features = ["trace"] }
opentelemetry-otlp = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Config
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tokio-test = "0.4"
