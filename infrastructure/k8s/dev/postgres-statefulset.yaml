apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: autolytiq-postgres
  namespace: autolytiq-dev
  labels:
    app.kubernetes.io/name: autolytiq-postgres
    app.kubernetes.io/part-of: autolytiq
spec:
  serviceName: autolytiq-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autolytiq-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autolytiq-postgres
        app.kubernetes.io/part-of: autolytiq
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: autolytiq-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - autolytiq
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - autolytiq
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
