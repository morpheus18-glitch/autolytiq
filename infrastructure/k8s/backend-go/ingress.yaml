apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-go
  namespace: autolytiq-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.autolytiq.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Origin, Content-Type, Accept, Authorization"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    service.beta.kubernetes.io/do-loadbalancer-name: "autolytiq-lb"
    service.beta.kubernetes.io/do-loadbalancer-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-algorithm: "round_robin"
spec:
  tls:
  - hosts:
    - api.autolytiq.com
    secretName: autolytiq-api-tls
  rules:
  - host: api.autolytiq.com
    http:
      paths:
      - path: /v2
        pathType: Prefix
        backend:
          service:
            name: backend-go
            port:
              number: 3001
