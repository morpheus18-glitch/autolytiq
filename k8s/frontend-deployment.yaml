apiVersion: apps/v1
kind: Deployment
metadata:
  name: autolytiq-frontend
  labels:
    app: autolytiq
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autolytiq
      component: frontend
  template:
    metadata:
      labels:
        app: autolytiq
        component: frontend
    spec:
      # Run on general pool, not ML pool
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "doks.digitalocean.com/node-pool"
                operator: In
                values:
                - "pool-autolytiq"
      containers:
      - name: frontend
        image: autolytiq-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: autolytiq-frontend
  labels:
    app: autolytiq
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: autolytiq
    component: frontend
