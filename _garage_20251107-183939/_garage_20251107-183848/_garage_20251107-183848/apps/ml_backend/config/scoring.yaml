objectives:
  gross_weight: 0.35          # prioritize profitability
  close_weight: 0.30          # probability to close today
  approval_weight: 0.25       # likelihood a lender will approve
  payment_weight: 0.10        # lower is better (penalize high payment)

normalization:
  gross:
    # normalize against dealership/class baselines (last 90d)
    baseline_avg: 3500
    baseline_std: 800
    clip_min: 0
    clip_max: 8000
  close_probability:
    clip_min: 0
    clip_max: 100
  approval_probability:
    clip_min: 0
    clip_max: 100
  payment:
    # lower payment → higher score after inversion
    target_payment: 300       # can be overridden per deal via request.constraints.targetPayment
    soft_cap: 450
    hard_cap: 650

constraints:
  global:
    max_ltv: 140              # never exceed lender-acceptable LTV envelope
    max_pti: 20               # PTI hard ceiling
    min_gross: 500            # do not present options below this unless flagged
    terms_allowed: [60, 72, 84]
    apr_bounds:
      min: 0.0
      max: 24.0
  search:
    price_delta_abs: 1500     # +/- exploration around current selling price
    price_step: 50
    down_step: 500
    term_candidates: [60, 72, 84]
    consider_rebates: true
    consider_trade_adjustments: true

policy:
  tie_breakers:
    - max_approval_probability
    - max_gross
    - min_payment
  warnings:
    low_gross_threshold: 800
    high_payment_threshold: 500
    risky_profile_threshold: 0.65  # risk score

# How scoring is computed (conceptual)
#
# score =
#   w_g * norm(gross) +
#   w_c * (close_prob/100) +
#   w_a * (approval_prob/100) +
#   w_p * invert(norm(payment))
#
# - norm(gross) uses clipped z-score → min-max to 0,1.
# - invert(norm(payment)) = 1 - norm(payment) so lower payments score higher.
# - Hard constraints filter candidates before scoring; soft constraints apply penalties (e.g., if payment > soft_cap, subtract 0.05).

