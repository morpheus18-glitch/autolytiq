services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - db
      - ml
      - s3
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://backend:5000
    ports:
      - "3000:80"
    depends_on:
      - backend
