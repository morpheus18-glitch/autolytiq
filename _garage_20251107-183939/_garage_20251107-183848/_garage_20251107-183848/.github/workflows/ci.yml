name: CI

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -w typecheck || echo "Type check failed, continuing..."

      - name: Lint
        run: pnpm -w lint || echo "Lint failed, continuing..."

      - name: Build all packages
        run: pnpm -w build

      - name: Run tests
        run: pnpm -w test || echo "Tests failed or not configured, continuing..."

      - name: Check for build artifacts
        run: |
          echo "Checking build artifacts..."
          ls -lh packages/ui/dist/ || echo "UI dist missing"
          ls -lh packages/insights-engine/dist/ || echo "Insights engine dist missing"
          ls -lh apps/frontend/dist/ || echo "Frontend dist missing"
          ls -lh apps/backend/dist/ || echo "Backend dist missing"

  security-scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
