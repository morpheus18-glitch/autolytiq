apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autolytiq-ingress
  namespace: autolytiq-prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - autolytiq.com
    - www.autolytiq.com
    secretName: autolytiq-tls
  rules:
  # Main domain
  - host: autolytiq.com
    http:
      paths:
      # Backend API
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: autolytiq-backend
            port:
              number: 3000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: autolytiq-backend
            port:
              number: 3000
      # Frontend (catch-all)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: autolytiq-frontend
            port:
              number: 80
  # WWW subdomain
  - host: www.autolytiq.com
    http:
      paths:
      # Backend API
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: autolytiq-backend
            port:
              number: 3000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: autolytiq-backend
            port:
              number: 3000
      # Frontend (catch-all)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: autolytiq-frontend
            port:
              number: 80
