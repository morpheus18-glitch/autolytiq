services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://autolytiq:autolytiq@db:5432/autolytiq?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgres://autolytiq:autolytiq@db:5432/autolytiq?schema=public}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:8000}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-dev-ml-token}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio123}
      S3_BUCKET: ${S3_BUCKET:-autolytiq-dev}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9000}
      S3_CLOUDFRONT_URL: ${S3_CLOUDFRONT_URL:-http://localhost:9000}
      PRINT_BASE_URL: ${PRINT_BASE_URL:-http://backend:5000}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-}
      SKIP_DB_MIGRATIONS: ${SKIP_DB_MIGRATIONS:-}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
      s3:
        condition: service_started
    volumes:
      - ./prisma:/app/prisma:ro
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://backend:5000
    ports:
      - "3000:80"
    depends_on:
      - backend
  ml:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autolytiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autolytiq}
      POSTGRES_DB: ${POSTGRES_DB:-autolytiq}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
  pg-router:
    image: nginx:1.27-alpine
    depends_on:
      - db
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/docker/nginx/postgres-stream.conf:/etc/nginx/nginx.conf:ro
  s3:
    image: minio/minio:RELEASE.2024-10-13T03-09-05Z
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data
volumes:
  db-data:
  s3-data:
