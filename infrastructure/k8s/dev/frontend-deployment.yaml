apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: autolytiq-dev
  labels:
    app.kubernetes.io/name: autolytiq-frontend
    app.kubernetes.io/part-of: autolytiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autolytiq-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autolytiq-frontend
        app.kubernetes.io/part-of: autolytiq
    spec:
      containers:
        - name: frontend
          image: autolytiq/frontend-dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
