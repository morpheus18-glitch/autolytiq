apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configuration
  namespace: ingress-nginx
data:
  # Block common bot user agents
  block-user-agents: "~*(?:bot|crawler|spider|scraper|curl|wget|python-requests|php|perl)"
  # Enable ModSecurity WAF (if available)
  enable-modsecurity: "true"
  enable-owasp-modsecurity-crs: "true"
  # Hide nginx version
  hide-headers: "Server,X-Powered-By"
  server-tokens: "false"
  # Connection limits
  limit-req-status-code: "429"
  limit-conn-status-code: "429"
  # SSL settings
  ssl-protocols: "TLSv1.2 TLSv1.3"
  ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384"
  ssl-prefer-server-ciphers: "true"
  ssl-session-cache: "shared:SSL:10m"
  ssl-session-timeout: "10m"
  # DDoS protection
  client-body-buffer-size: "1M"
  client-header-buffer-size: "1k"
  large-client-header-buffers: "4 8k"
  # Enable real IP forwarding (for CloudFlare/proxy)
  use-forwarded-headers: "true"
  compute-full-forwarded-for: "true"
  use-proxy-protocol: "false"
  # Additional security headers (global)
  add-headers: "autolytiq-prod/custom-headers"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-headers
  namespace: autolytiq-prod
data:
  X-Frame-Options: "SAMEORIGIN"
  X-Content-Type-Options: "nosniff"
  X-XSS-Protection: "1; mode=block"
  Referrer-Policy: "strict-origin-when-cross-origin"
  Permissions-Policy: "geolocation=(), microphone=(), camera=()"
  Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.autolytiq.com wss://app.autolytiq.com; frame-ancestors 'self';"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rate-limit-config
  namespace: autolytiq-prod
data:
  # Rate limiting zones
  limit-rate: "100k"  # Limit bandwidth per connection
  limit-rate-after: "500k"  # Start limiting after this many bytes
