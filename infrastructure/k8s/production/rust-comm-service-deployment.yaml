apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-comm-service
  labels:
    app.kubernetes.io/name: rust-comm-service
    app.kubernetes.io/part-of: autolytiq
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-comm-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-comm-service
        app.kubernetes.io/part-of: autolytiq
    spec:
      imagePullSecrets:
        - name: do-regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: rust-comm-service
          image: registry.digitalocean.com/autolytiq/rust-comm-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
              name: grpc
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: RUST_LOG
              value: info
            - name: COMM_SERVICE__SERVICE__PORT
              value: "50052"
            - name: COMM_SERVICE__SERVICE__HOST
              value: "0.0.0.0"
            - name: COMM_SERVICE__DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: DATABASE_URL
            - name: COMM_SERVICE__REDIS__URL
              value: "redis://redis.autolytiq-prod.svc.cluster.local:6379"
            - name: COMM_SERVICE__LOGGING__LEVEL
              value: info
            - name: COMM_SERVICE__LOGGING__FORMAT
              value: json
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rust-comm-service
  labels:
    app.kubernetes.io/name: rust-comm-service
    app.kubernetes.io/part-of: autolytiq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rust-comm-service
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
