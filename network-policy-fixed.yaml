apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autolytiq-network-policy
  namespace: autolytiq-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80    # frontend nginx (FIXED - was missing!)
        - protocol: TCP
          port: 3000  # backend
        - protocol: TCP
          port: 5000  # backend (alternative)
        - protocol: TCP
          port: 8000  # ml-service
        - protocol: TCP
          port: 8080  # alternative ports
    # Allow inter-pod communication within namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 80    # frontend nginx
        - protocol: TCP
          port: 3000  # backend
        - protocol: TCP
          port: 5000  # backend (alternative)
        - protocol: TCP
          port: 8000  # ml-service
        - protocol: TCP
          port: 8080  # alternative ports
        - protocol: TCP
          port: 50051  # rust-pricing gRPC
        - protocol: TCP
          port: 50052  # rust-comm-service gRPC
        - protocol: TCP
          port: 6379   # redis
  egress:
    # Allow all egress (can be restricted later based on requirements)
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector: {}
    - ports:
        - protocol: TCP
        - protocol: UDP
