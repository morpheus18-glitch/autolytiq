name: ML Service Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'ml_service/**'
      - 'apps/ml_backend/**'
      - 'infrastructure/docker/Dockerfile.ml'
      - 'infrastructure/k8s/production/ml-service-deployment.yaml'
      - '.github/workflows/ml.yml'
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/autolytiq
  IMAGE_NAME: ml-service
  DEPLOYMENT_NAME: ml-service
  CONTAINER_NAME: ml-service
  CLUSTER: autolytiq-cluster
  NAMESPACE: autolytiq-prod

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
      - name: Authenticate to DOCR
        run: doctl registry login --expiry-seconds 3600
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.ml
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER }}
      - name: Ensure namespace exists
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
      - name: Refresh DOCR secret
        run: |
          doctl registry docker-config --expiry-seconds 3600 \
            | kubectl -n ${{ env.NAMESPACE }} create secret generic do-regcred \
              --from-file=.dockerconfigjson=/dev/stdin \
              --type=kubernetes.io/dockerconfigjson \
              --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy ML service
        run: |
          sed "s|image:.*ml-service:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" \
            infrastructure/k8s/production/ml-service-deployment.yaml | \
            kubectl apply -n ${{ env.NAMESPACE }} -f -
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=180s
