apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: dms-production
  labels:
    app: celery-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ghcr.io/autolytiq/dms-ml-service:latest
          command: ["celery", "-A", "workers.celery_app", "worker", "--queues=high_priority,default", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: REDIS_URL
            - name: CLICKHOUSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: CLICKHOUSE_HOST
            - name: CLICKHOUSE_PORT
              valueFrom:
                configMapKeyRef:
                  name: dms-config
                  key: CLICKHOUSE_PORT
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      imagePullSecrets:
        - name: registry-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: dms-production
  labels:
    app: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: ghcr.io/autolytiq/dms-ml-service:latest
          command: ["celery", "-A", "workers.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: REDIS_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      imagePullSecrets:
        - name: registry-credentials
