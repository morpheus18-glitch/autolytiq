apiVersion: apps/v1
kind: Deployment
metadata:
  name: autolytiq-frontend
  namespace: autolytiq-prod
  labels:
    app: autolytiq
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autolytiq
      component: frontend
  template:
    metadata:
      labels:
        app: autolytiq
        component: frontend
    spec:
      # Run on general pool, not ML pool
      nodeSelector:
        doks.digitalocean.com/node-pool: pool-autolytiq
      containers:
      - name: frontend
        image: registry.digitalocean.com/autolytiq/autolytiq-frontend:fresh
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: autolytiq-frontend
  namespace: autolytiq-prod
  labels:
    app: autolytiq
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: autolytiq
    component: frontend
