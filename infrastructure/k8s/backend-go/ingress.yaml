apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-go
  namespace: autolytiq-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.autolytiq.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Origin, Content-Type, Accept, Authorization"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.autolytiq.com
    secretName: autolytiq-api-tls
  rules:
  - host: api.autolytiq.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-go
            port:
              number: 3001
