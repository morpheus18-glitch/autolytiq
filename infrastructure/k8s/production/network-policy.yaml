apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autolytiq-network-policy
  namespace: autolytiq-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5000  # backend
        - protocol: TCP
          port: 3000  # frontend
        - protocol: TCP
          port: 8000  # ml-service
    # Allow inter-pod communication within namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 50051  # rust-pricing gRPC
        - protocol: TCP
          port: 6379   # redis
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow external HTTPS (for APIs, webhooks, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    # Allow PostgreSQL (external)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 25060
    # Allow internal communication
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 6379
